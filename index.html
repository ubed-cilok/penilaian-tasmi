<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penilaian Tasmi</title>

<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="card">
  <h2>Form Penilaian Tasmi</h2>

  <div class="field">
    <label>Nama Santri</label>
    <input type="text" id="nama">
  </div>

  <div class="field">
    <label>Kelas</label>
    <input type="text" id="kelas">
  </div>

  <div class="field">
    <label>Juz</label>
    <input type="text" id="juz">
  </div>

  <table width="100%">
    <tr>
      <th>Hal</th>
      <th>Kes Tahfizh</th>
      <th>Kes Tahsin</th>
    </tr>
    <tbody id="halamanRows"></tbody>
  </table>

  <div class="grid">
    <div class="result" id="box-tahfizh">Nilai Tahfizh: 200</div>
    <div class="result" id="box-tahsin">Nilai Tahsin: 50</div>
  </div>

  <div class="grid">
    <div class="result">Total: <span id="total">0</span></div>
    <div class="result">Akhir: <span id="akhir">0</span></div>
  </div>

  <button onclick="simpan()">Simpan</button>
  <button class="btn-pdf" onclick="exportPDF()">Export PDF</button>
</div>

<script>
const tbody = document.getElementById("halamanRows");
for(let i=1;i<=5;i++){
  tbody.innerHTML += `<tr>
    <td>${i}</td>
    <td><input class="ktp" value="0"></td>
    <td><input class="ksp" value="0"></td>
  </tr>`;
}

function hitung(){
  let t=0,s=0;
  document.querySelectorAll('.ktp').forEach(i=>t+=Number(i.value||0));
  document.querySelectorAll('.ksp').forEach(i=>s+=Number(i.value||0));
  let nt=200-t, ns=50-s;
  let total=nt+ns;
  document.getElementById("total").innerText=total;
  document.getElementById("akhir").innerText=(total/2.5).toFixed(2);
  return {total, akhir:(total/2.5).toFixed(2)};
}

document.addEventListener("input",hitung);

function resetForm(){
  nama.value=""; kelas.value=""; juz.value="";
  document.querySelectorAll('.ktp,.ksp').forEach(i=>i.value=0);
  hitung();
}
</script>

<script src="/app.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js');
}
</script>

</body>
</html>
