<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body{ font-family:'Segoe UI',Arial; background:#f2f5f9; padding:20px; }
  .card{ max-width:800px; background:#fff; padding:25px; border-radius:12px; box-shadow:0 6px 16px rgba(0,0,0,.1); margin:auto; margin-bottom:20px; }
  h2{ text-align:center; margin-bottom:20px; }
  .field{ margin-bottom:15px; }
  label{ font-weight:600; display:block; margin-bottom:6px; }
  input{ width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
  .result{ background:#f8f9fa; padding:12px; border-radius:8px; font-weight:bold; text-align:center; border:1px solid #eee; }
  button{ width:100%; padding:12px; border:none; background:#2563eb; color:white; border-radius:8px; cursor:pointer; font-weight:600; margin-top:10px; }
  button:hover{ background:#1d4ed8; }
  .btn-excel{ background:#16a34a; }
  
  /* Tabel Style */
  table.data-table { width:100%; border-collapse:collapse; margin-top:20px; font-size:13px; }
  table.data-table th, table.data-table td { border:1px solid #ddd; padding:10px; text-align:center; }
  table.data-table th { background:#f1f5f9; }
  .btn-small { padding:5px 10px; font-size:11px; margin:2px; width:auto; }
</style>
</head>
<body onload="muatTabel()">

<div class="card">
  <h2>Form Penilaian Tasmi</h2>
  <div class="field"><label>Nama Santri</label><input type="text" id="nama"></div>
  <div class="field"><label>Kelas</label><input type="text" id="kelas"></div>
  <div class="field"><label>Juz</label><input type="text" id="juz"></div>

  <table width="100%">
    <tr><th>Hal</th><th>Kes Tahfizh (Maks 40)</th><th>Kes Tahsin (Maks 40)</th></tr>
    <tbody id="halamanRows"></tbody>
  </table>

  <div class="grid">
    <div class="result" id="box-tahfizh">Nilai Tahfizh: 200 - 0 = 200</div>
    <div class="result" id="box-tahsin">Nilai Tahsin: 50 - 0 = 50</div>
  </div>
  <div class="grid">
    <div class="result">Total: <span id="total">0</span></div>
    <div class="result">Akhir: <span id="akhir">0.00</span></div>
  </div>

  <button onclick="simpan()">Simpan & Lanjutkan Input</button>
  <button class="btn-excel" onclick="exportSemuaExcel()">Download Semua (Excel)</button>
</div>

<div class="card">
  <h3>Riwayat Penilaian</h3>
  <table class="data-table">
    <thead>
      <tr>
        <th>Nama</th><th>Kelas</th><th>N. Tahfizh</th><th>N. Tahsin</th><th>Akhir</th><th>Aksi</th>
      </tr>
    </thead>
    <tbody id="isiTabel"></tbody>
  </table>
</div>

<script>
// Inisialisasi Baris Tabel Input
const tbody = document.getElementById("halamanRows");
for(let i=1; i<=5; i++){
  tbody.innerHTML += `<tr><td align="center">${i}</td>
    <td><input type="text" class="ktp" placeholder="0"></td>
    <td><input type="text" class="ksp" placeholder="0"></td></tr>`;
}

function jumlahDigit(s){ return (s||"").toString().split("").reduce((a,b)=>a+(parseInt(b)||0),0); }

function hitung() {
  let tErr=0, sErr=0;
  document.querySelectorAll(".ktp").forEach(i => {
    let val = jumlahDigit(i.value);
    if(val > 40) { alert("Maksimal 40 per halaman!"); i.value=""; val=0; }
    tErr += val;
  });
  document.querySelectorAll(".ksp").forEach(i => {
    let val = jumlahDigit(i.value);
    if(val > 40) { alert("Maksimal 40 per halaman!"); i.value=""; val=0; }
    sErr += val;
  });

  const nT = 200 - tErr, nS = 50 - sErr;
  const total = nT + nS, akhir = (total/2.5).toFixed(2);

  document.getElementById("box-tahfizh").innerHTML = `Nilai Tahfizh: 200 - ${tErr} = ${nT}`;
  document.getElementById("box-tahsin").innerHTML = `Nilai Tahsin: 50 - ${sErr} = ${nS}`;
  document.getElementById("total").innerText = total;
  document.getElementById("akhir").innerText = akhir;
  return { tErr, sErr, nT, nS, total, akhir };
}

document.addEventListener("input", e => { if(e.target.classList.contains("ktp") || e.target.classList.contains("ksp")) hitung(); });

function muatTabel() {
  google.script.run.withSuccessHandler(data => {
    let html = "";
    data.forEach((r) => {
      // r adalah satu baris data dari Google Sheet (11 kolom)
      html += `<tr>
        <td>${r[0]}</td>
        <td>${r[1]}</td>
        <td>${r[7]}</td>
        <td>${r[8]}</td>
        <td><b>${r[10]}</b></td>
        <td>
          <button class="btn-small" style="background:#ef4444; color:white;" onclick='unduhPDF(${JSON.stringify(r)})'>PDF</button>
        </td>
      </tr>`;
    });
    document.getElementById("isiTabel").innerHTML = html;
  }).getDataTabel();
}

function unduhPDF(row) {
  // Memberikan notifikasi loading kecil jika perlu
  google.script.run.withSuccessHandler(url => {
    const a = document.createElement("a");
    a.href = url;
    a.download = `Laporan_Tasmi_${row[0]}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }).generatePDF(row);
}

function simpan() {
  const h = hitung();
  const d = [
    document.getElementById("nama").value, document.getElementById("kelas").value, document.getElementById("juz").value,
    [...document.querySelectorAll(".ktp")].map(i=>i.value||0).join(","),
    [...document.querySelectorAll(".ksp")].map(i=>i.value||0).join(","),
    h.tErr, h.sErr, h.nT, h.nS, h.total, h.akhir
  ];
  if(!d[0]) return alert("Nama wajib diisi!");
  
  google.script.run.withSuccessHandler(dataBaru => {
    alert("Data Tersimpan!");
    resetForm();
    muatTabel();
  }).simpanNilai(d);
}

function resetForm() {
  document.getElementById("nama").value = "";
  document.getElementById("kelas").value = "";
  document.getElementById("juz").value = "";
  document.querySelectorAll(".ktp, .ksp").forEach(i => i.value = "");
  hitung();
  document.getElementById("nama").focus();
}

function unduhPDF(row) {
  google.script.run.withSuccessHandler(url => {
    const a = document.createElement("a"); a.href = url; a.download = `Nilai_${row[0]}.pdf`; a.click();
  }).generatePDF(row);
}

function exportSemuaExcel() {
  google.script.run.withSuccessHandler(data => {
    const ws = XLSX.utils.aoa_to_sheet([["Nama","Kelas","Juz","Hal1","Hal2","KesTaf","KesTas","NilaiTaf","NilaiTas","Total","Akhir"], ...data]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Data Nilai");
    XLSX.writeFile(wb, "Data_Penilaian_Tasmi.xlsx");
  }).getDataTabel();
}
</script>

<script src="app.js"></script>
</body>
</html>
